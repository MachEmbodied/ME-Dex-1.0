    expected_step: 50000
    normalization_group: dexjoco_shared_si
  tactile_expert: {initialization_seed: 42042, latent_dim: 48, latent_slices: 18, queries_per_slice: 34, condition_slices: 2, hidden_size: 1024, ffn_multiplier: 4, wan_num_heads: 24, wan_head_dim: 128, norm_eps: 1.0e-6, freq_dim: 256, token_packing: dexjoco_left_right}
  # Match the masked-zero VAT baseline for action padding/loss. V4 codec
  # validity remains preserved for tactile attention, noise, and loss.
  padding_contract: {masked_zero_padding: true, pi05_zero_padding: false}
