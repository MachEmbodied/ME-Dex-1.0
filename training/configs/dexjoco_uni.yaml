experiment:
  name: dexjoco_wtam_raw_aligned_shift1_11task_dj_tfa2_v4_uni_hand2_stage1_wan_random_action_tactile_full1100_original_v_32ppu
  architecture: wam_va
  variant: dexjoco_wtam_11task_dj_tfa2_v4_uni_hand2_2token_1024_full1100
  dataset_cohort: all1100_including_failed_replay_and_task_gates
  initialization: motus_stage1_wan_random_action_tactile
  temporal_contract:
    name: dexjoco_raw50_at16_stride3_v8_stride6_horizon960ms_v1
    note: "V/A timing is unchanged from VAT-v1: A/T +3..+48, V +6..+48."
  action_semantics:
    state_input: right22_then_left22_quantile_normalized_44d
    action_target: right22_then_left22_quantile_normalized_44d
    deployment_output: quantile_denormalized_before_environment_step
    single_arm_padding: masked_zero_for_clean_noise_noisy_target_and_inference
    action_loss_mask: per_sample_mean_over_valid_right22_only
  tactile_semantics:
    force_protocol: DJ-TFA-2.0-palmar
    physical_input: left16_then_right16_each_FnFuFv_10x14
    codec: v4_uni_50k_ema
    latent: 34_slots_x_48
    missing_slots: [3, 20]
    token_packing: fixed_left16_right16_to_2x768_then_linear_1024
    tactile_tokens: 18_frames_x_2_hands_equals_36
    padding: codec_frame_token_valid_is_always_preserved

training_mode: finetune
common:
  action_dim: 44
  state_dim: 44
  action_chunk_size: 16
  num_video_frames: 8
  video_height: 384
  video_width: 320
  global_downsample_rate: 3
  video_action_freq_ratio: 2
  source_fps: 50.0
  temporal_contract_name: dexjoco_raw50_at16_stride3_v8_stride6_horizon960ms_v1
dataset:
