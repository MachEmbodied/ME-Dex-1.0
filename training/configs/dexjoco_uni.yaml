    t5_cache_path: "${oc.env:DEXJOCO_T5_CACHE,datasets/dexjoco/t5_cache}"
    normalization_stats_path: "${oc.env:DEXJOCO_NORMALIZATION,assets/dexjoco/normalization.json}"
    embodiment: multitask
    val_enabled: false
    task_sampling: uniform_over_tasks
    sampling_mode: window_index
    va_uniform_window_sampling: true
    sampling_seed: 42
    sampling_global_batch_size: 64
    condition_only: false
    samples_per_episode: 32
    action_count: 16
    action_stride: 3
    num_video_frames: 8
    video_stride: 6
    tasks: [click_mouse, fold_glasses, hammer_nail, pick_bucket, pinch_tongs, water_plant, bimanual_assembly, bimanual_hanoi, bimanual_microwave_cook, bimanual_photograph, bimanual_unlock_ipad]
